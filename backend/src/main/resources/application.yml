server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: farm-to-home-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:${DATABASE_PUBLIC_URL:jdbc:postgresql://localhost:5434/farm_to_home}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${PGUSER:${POSTGRES_USER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:root}}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:${SPRING_MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}}
    port: ${MAIL_PORT:${SPRING_MAIL_PORT:${SMTP_PORT:587}}}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:${SMTP_USER:${SMTP_USERNAME:}}}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:${SMTP_PASS:${SMTP_PASSWORD:}}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors-origins: "${CORS_ORIGINS:https://flutter-frontend-production-e8d6.up.railway.app,https://*.railway.app,https://*.up.railway.app,http://localhost:*,*}"
  mail-from: ${MAIL_FROM:noreply@farmtohome.com}


logging:
  level:
    root: INFO
    org.springframework.security: WARN
