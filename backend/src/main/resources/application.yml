server:
  port: ${PORT:8085}
  shutdown: graceful

spring:
  application:
    name: farm-to-home-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:${DATABASE_PUBLIC_URL:jdbc:postgresql://localhost:5434/farm_to_home}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${PGUSER:${POSTGRES_USER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:root}}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FarmToHomeHikariCP
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 15000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: false
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
          batch_size: 10
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    repair-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:465}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${APP_MAIL_FROM:${MAIL_FROM:veeramallasaipichaiah456@gmail.com}}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:hinnvjmxxziliiim}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          ssl:
            trust: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:*}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:3000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:3000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors-origins: "${CORS_ORIGINS:https://flutter-frontend-production-1590.up.railway.app,https://flutter-frontend-production-e8d6.up.railway.app,https://*.railway.app,https://*.up.railway.app,http://localhost:*,http://127.0.0.1:*,*}"
  mail-from: ${APP_MAIL_FROM:${MAIL_FROM:${SPRING_MAIL_USERNAME:veeramallasaipichaiah456@gmail.com}}}
  resend-from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
  google:
    client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_WEB_CLIENT_ID:1066615778167-ochceogaf54rramkojskbrbqlkfr3fi6.apps.googleusercontent.com}}
  jwt:
    issuer: ${APP_JWT_ISSUER:farm-to-home-api}
    secret: ${APP_JWT_SECRET:farm-to-home-development-secret-change-in-production-32chars}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:86400}


logging:
  level:
    root: INFO
    org.springframework.security: WARN
