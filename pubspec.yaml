name: farm_to_home_app
description: "Farm To Home - Production-ready retail and wholesale grocery application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  animate_do: ^3.0.2
  shimmer: ^3.0.0

  geolocator: ^10.1.0
  geocoding: ^4.0.0

  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^9.2.4
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/categories/
    - assets/images/vegetables/
    - assets/images/fruits/
    - assets/images/dairy/
